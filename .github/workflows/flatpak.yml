# Builds the Nuntius Flatpak for x86_64 and aarch64 with phosh-toolkit's
# reusable workflow (docs/flatpak.md): tags v<version> publish the stable
# app, pushes to phosh the nightly app de.nexumia.Nuntius.Devel; both
# reach nexumia-de/phosh-apps.
# Until the first stable tag is published, pushes to phosh also replace
# the bundles of the release "rolling", which phosh-apps lists as
# "nexumia-de/nuntius rolling"; remove the jobs "rolling" and "notify"
# when apps.txt lists plain "nexumia-de/nuntius".
name: Flatpak

on:
  push:
    branches: [phosh]
    tags: ['v*']
  pull_request:
    branches: [phosh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The vendored crates must match Cargo.lock, or the offline build
  # fails; after an upstream merge run build-aux/update-cargo-sources.sh.
  cargo-sources:
    name: Cargo sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the vendored cargo sources
        run: build-aux/update-cargo-sources.sh --check

  # The scripts meson runs for the fork (the release list).
  build-scripts:
    name: Build scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test build-aux scripts
        run: python3 -m unittest discover -s build-aux/tests -v

  flatpak:
    permissions:
      contents: write
    uses: nexumia-de/phosh-toolkit/.github/workflows/flatpak.yml@main
    with:
      manifest: build-aux/de.nexumia.Nuntius.json
      release: true
      nightly: true
      publish-repo: nexumia-de/phosh-apps
      # Fractal's release build takes about 30 minutes with a warm cache.
      build-timeout-minutes: 120
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

  rolling:
    name: Publish rolling release
    needs: flatpak
    if: github.event_name == 'push' && github.ref_name == 'phosh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: rolling-publish
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      # The stable bundles and their source bundles, not the nightly ones.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: de.nexumia.Nuntius-*
          merge-multiple: true

      - name: Attach bundles to the release "rolling"
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # An older push that finishes later must not replace newer bundles.
          head=$(gh api "repos/$GH_REPO/commits/phosh" --jq .sha)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::phosh moved on to ${head::7}; its own run publishes it."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="Build of phosh · ${GITHUB_SHA::7} ($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA). Replaced by every push to phosh until the first stable release."
          files=(bundles/*.flatpak)
          if gh release view rolling >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/rolling" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload rolling "${files[@]}" --clobber
            gh release edit rolling --notes "$notes"
          else
            gh release create rolling "${files[@]}" --target "$GITHUB_SHA" \
              --title "Nuntius (rolling)" --notes "$notes"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify phosh-apps
    needs: rolling
    if: needs.rolling.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch "app-updated"
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No PUBLISH_TOKEN; nexumia-de/phosh-apps picks this release up on its schedule."
            exit 0
          fi
          gh api repos/nexumia-de/phosh-apps/dispatches -f event_type=app-updated \
            -f "client_payload[repository]=$GITHUB_REPOSITORY"
