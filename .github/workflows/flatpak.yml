# Builds the Nuntius Flatpak for x86_64 and aarch64 from
# build-aux/de.nexumia.Nuntius.json and keeps the bundles as artifacts;
# pushes to phosh also publish them as the release "rolling" for
# phosh-apps.
# Steps and pinned actions follow phosh-toolkit's reusable flatpak.yml,
# which this fork cannot use yet: cargo fetches crates during the build
# (build-args --share=network, as upstream's manifest does), so
# Flathub's linter and the licence checks would fail.
name: Flatpak

on:
  push:
    branches: [phosh]
  pull_request:
    branches: [phosh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      MANIFEST: build-aux/de.nexumia.Nuntius.json
      APP_ID: de.nexumia.Nuntius
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flatpak tooling
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          "${apt[@]}" install -y -q --no-install-recommends \
            flatpak flatpak-builder librsvg2-common elfutils
          # Ubuntu 24.04 restricts unprivileged user namespaces, which
          # bubblewrap needs for the build sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('build-aux/de.nexumia.Nuntius.json', 'Cargo.lock') }}
          restore-keys: |
            flatpak-builder-${{ matrix.arch }}-

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --ccache --force-clean --arch=${{ matrix.arch }} \
            --repo=repo build-dir "$MANIFEST"

      - name: Check installed metadata
        run: |
          desktop=build-dir/files/share/applications/$APP_ID.desktop
          metainfo=build-dir/files/share/metainfo/$APP_ID.metainfo.xml
          test -f "$desktop" && test -f "$metainfo"
          grep -Eiq '^X-Purism-FormFactor=.*mobile;' "$desktop"
          grep -q '^Name=Nuntius$' "$desktop"
          test -f "build-dir/files/share/glib-2.0/schemas/$APP_ID.gschema.xml"

      - name: Bundle
        run: |
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$APP_ID-${{ matrix.arch }}.flatpak" "$APP_ID"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP_ID }}-${{ matrix.arch }}
          path: ${{ env.APP_ID }}-${{ matrix.arch }}.flatpak
          retention-days: 14

  # Pushes to phosh replace the bundles of the release "rolling", which
  # phosh-apps publishes (apps.txt line "nexumia-de/nuntius rolling").
  # Follows the "nightly" job of phosh-toolkit's flatpak.yml; the stable
  # tag releases come with that workflow (#3).
  publish:
    name: Publish rolling release
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'phosh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: rolling-publish
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true

      - name: Attach bundles to the release "rolling"
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # An older push that finishes later must not replace newer bundles.
          head=$(gh api "repos/$GH_REPO/commits/phosh" --jq .sha)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::phosh moved on to ${head::7}; its own run publishes it."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="Build of phosh · ${GITHUB_SHA::7} ($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA). Replaced by every push to phosh; install it from the nexumia Flatpak repository."
          files=(bundles/*.flatpak)
          if gh release view rolling >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/rolling" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload rolling "${files[@]}" --clobber
            gh release edit rolling --notes "$notes"
          else
            gh release create rolling "${files[@]}" --target "$GITHUB_SHA" \
              --title "Nuntius (rolling)" --notes "$notes"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify phosh-apps
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch "app-updated"
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No PUBLISH_TOKEN; nexumia-de/phosh-apps picks this release up on its schedule."
            exit 0
          fi
          gh api repos/nexumia-de/phosh-apps/dispatches -f event_type=app-updated \
            -f "client_payload[repository]=$GITHUB_REPOSITORY"
