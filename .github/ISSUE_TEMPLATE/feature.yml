name: Feature request
description: Suggest something Nuntius should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How Nuntius could help. Screenshots of other apps are welcome.
